# Local Minecraft server for development and evaluation (AGENTS.md decisions 3 and 4).
# Ports bind to 127.0.0.1 only: LLM-written code drives the bot, so the server must never be reachable from outside.
services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: minecraft-agent-server
    environment:
      EULA: "TRUE"
      TYPE: VANILLA
      VERSION: "1.21.11"
      # Offline mode lets the bot join without a Microsoft account; safe only because the server is localhost-only.
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      # One level directory per seed; the evaluator switches worlds with scenario.world (P2.2b).
      SEED: "${MC_SEED:-20261119}"
      LEVEL: "${MC_LEVEL:-world}"
      MODE: survival
      DIFFICULTY: easy
      MAX_PLAYERS: "4"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "8"
      MOTD: minecraft-agent dev server
      # RCON is for the evaluator and scenario builder only; the agent's bot is never op (no OPS entry here).
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${MC_RCON_PASSWORD:?set MC_RCON_PASSWORD in .env}"
      MEMORY: 2G
    ports:
      - "127.0.0.1:25565:25565"
      - "127.0.0.1:25575:25575"
    volumes:
      - ./data/server:/data
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6
    restart: unless-stopped
