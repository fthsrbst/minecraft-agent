[project]
name = "agent-core"
version = "0.1.0"
description = "Game-independent core of the learning game agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "W", # pycodestyle
  "F",      # pyflakes
  "I",      # import sorting
  "B",      # bugbear: likely bugs
  "UP",     # pyupgrade: modern syntax for 3.13
  "SIM",    # simplifications
  "RUF",    # ruff-specific
  "ASYNC",  # async pitfalls (the core is asyncio-based)
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
